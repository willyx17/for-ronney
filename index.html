<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليكي ❤️</title>
<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#ffd1dc,#ffe9f1);
  text-align:center;
  overflow-x:hidden;
}

/* الكارت */
.card{
  background:white;
  padding:28px;
  border-radius:24px;
  width:90%;
  max-width:430px;
  margin:80px auto;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  position:relative;
  z-index:2;
}

button{
  background:#ff4d6d;
  color:white;
  border:none;
  padding:14px 26px;
  border-radius:28px;
  font-size:18px;
  cursor:pointer;
}

input{
  padding:12px;
  border-radius:15px;
  border:1px solid #ddd;
  text-align:center;
  font-size:17px;
}

/* القلوب */
.hearts{position:fixed;inset:0;overflow:hidden;z-index:0}
.heart{
 position:absolute;width:18px;height:18px;background:#ff4d6d;
 transform:rotate(45deg);
 animation:float linear infinite;
 opacity:.5;
}
.heart:before,.heart:after{
 content:'';position:absolute;width:18px;height:18px;background:#ff4d6d;border-radius:50%;
}
.heart:before{top:-9px}.heart:after{left:-9px}

@keyframes float{
 from{transform:translateY(100vh) rotate(45deg)}
 to{transform:translateY(-10vh) rotate(45deg)}
}

#text{white-space:pre-line;line-height:2.1}
#final{display:none;font-size:24px;margin-top:20px;animation:fade 1.2s forwards}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

.hidden{display:none}
</style>
</head>
<body>
<div class="hearts"></div>
<div class="card" id="login">
<h2>اكتبي التاريخ 🎀</h2>
<input id="pass" type="password">
<br><br>
<button onclick="enter()">دخول</button>
<p id="err" style="color:red"></p>
</div>
<div class="card hidden" id="content">
<h2>بصراحة 💗</h2>
<p id="text"></p>
<h3 id="days"></h3>
<h3 id="countdown"></h3>
<button onclick="start()">ابدئي 🎵</button>
<div id="final">أنا مبعتش لينك… أنا بعتلك إحساس ❤️</div>
</div>
<script>

/* قلوب */
const h=document.querySelector(".hearts");
for(let i=0;i<35;i++){
 let e=document.createElement("div");
 e.className="heart";
 e.style.left=Math.random()*100+"vw";
 e.style.animationDuration=5+Math.random()*6+"s";
 h.appendChild(e);
}

/* دخول */
function enter(){
 if(pass.value==="24/3"){
  login.classList.add("hidden");
  content.classList.remove("hidden");
  calcDays();
  birthday();
 }else err.innerText="غلط 🙈";
}

/* الأيام */
function calcDays(){
 const start=Date.UTC(2025,6,2);
 const now=Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
 const diff=Math.floor((now-start)/86400000);
 days.innerText="عدى علينا "+diff+" يوم سوا 💞";
}

/* عداد عيد ميلاد */
function birthday(){
 const target=new Date("2026-03-24T00:00:00");
 setInterval(()=>{
  let now=new Date();
  let d=Math.floor((target-now)/86400000);
  let h=Math.floor((target-now)%86400000/3600000);
  let m=Math.floor((target-now)%3600000/60000);
  countdown.innerText="فاضل "+d+" يوم "+h+" ساعة "+m+" دقيقة 🎂";
 },1000);
}

/* كتابة */
const msg=`يمكن مش بعرف أقول كلام كبير...
بس وجودك بقى جزء من يومي مش حاجة عابرة

من 2 يوليو 2025
وأنا بقيت أشوف حاجات كتير بشكل أحلى
حتى الأيام العادية بقت ليها معنى

يمكن مش بقولها كتير
بس أنا مرتاح معاكي بشكل حقيقي ❤️`;

let i=0;
function start(){
 song.volume=.6;
 song.play();
 requestAnimationFrame(type);
}

function type(){
 if(i<msg.length){
  text.innerHTML+=msg.charAt(i);
  i++;
  setTimeout(()=>requestAnimationFrame(type),35);
 }else{
  final.style.display="block";
  boom();
 }
}

/* كونفيتي */
function boom(){
 for(let i=0;i<70;i++){
  let c=document.createElement("div");
  c.style.position="fixed";
  c.style.width="6px";c.style.height="6px";
  c.style.background=["#ff4d6d","#ffa3b5","#ffd6e0"][Math.floor(Math.random()*3)];
  c.style.left=Math.random()*100+"vw";
  c.style.top="-10px";
  c.style.borderRadius="50%";
  c.style.transition="3s linear";
  document.body.appendChild(c);
  setTimeout(()=>c.style.top="110vh",50);
 }
}

</script>
</body>
</html>
:::
