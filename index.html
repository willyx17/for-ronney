<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بصراحة 💗</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd1dc,#ffe6f0);
font-family:system-ui;
}

.card{
background:white;
padding:35px;
border-radius:25px;
text-align:center;
width:85%;
max-width:350px;
box-shadow:0 10px 40px rgba(0,0,0,.15);
}

input{
width:80%;
padding:14px;
border-radius:15px;
border:2px solid #eee;
font-size:18px;
text-align:center;
margin-top:15px;
}

button{
margin-top:18px;
padding:14px 30px;
border:none;
border-radius:20px;
font-size:18px;
background:#ff4d79;
color:white;
cursor:pointer;
}

button:active{transform:scale(.95)}
</style>
</head>

<body>

<div class="card">
<h2>بصراحة 💗</h2>

<input id="pass" type="password" placeholder="اكتبي التاريخ">
<br>
<button onclick="check()">دخول</button>
</div>

<script>
function check(){
let p=document.getElementById("pass").value.trim();

if(p=="24/3"){
window.location.href="message.html";
}else{
alert("حاولي تاني 🥺");
}
}
</script>

</body>
</html>
