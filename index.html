<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لـِك ❤️</title>

<style>
body{
  margin:0;
  font-family: system-ui;
  background:linear-gradient(135deg,#ffd1dc,#ffe6f0);
  overflow-x:hidden;
  text-align:center;
}

/* شاشة الباسورد */
.lock{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#ffd1dc,#ffc2d1);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  z-index:9999;
}

.lock input{
  padding:14px;
  border-radius:15px;
  border:none;
  text-align:center;
  font-size:18px;
}

.lock button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  font-size:18px;
}

/* القلوب */
.hearts{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:-1;
}

.heart{
  position:absolute;
  width:18px;
  height:18px;
  background:red;
  transform:rotate(45deg);
  animation:float 8s linear infinite;
}

.heart:before,.heart:after{
  content:"";
  position:absolute;
  width:18px;height:18px;
  background:red;
  border-radius:50%;
}

.heart:before{top:-9px;}
.heart:after{left:-9px;}

@keyframes float{
  from{transform:translateY(100vh) rotate(45deg);}
  to{transform:translateY(-10vh) rotate(45deg);}
}

/* الكارت */
.card{
  background:white;
  max-width:500px;
  margin:80px auto;
  padding:30px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

button.main{
  background:#ff4d6d;
  border:none;
  color:white;
  padding:14px 28px;
  border-radius:30px;
  font-size:18px;
  margin-top:20px;
}

#final{
  display:none;
  font-size:26px;
  margin-top:20px;
  animation:pop 1s ease forwards;
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<!-- شاشة الباسورد -->
<div id="lockScreen" class="lock">
  <h2>اكتبي التاريخ 🎀</h2>
  <input id="pass" type="password" placeholder="اليوم/الشهر">
  <button onclick="checkPass()">افتحي</button>
  <p id="wrong" style="color:red;display:none">غلط 🙈</p>
</div>

<div class="hearts"></div>

<div class="card" id="content" style="display:none">
  <h2>بصراحة 💗</h2>

  <p id="text"></p>

  <h3 id="days"></h3>
  <h3 id="countdown"></h3>

  <button class="main" onclick="startAll()">شغلي الأغنية 🎵</button>

  <div id="final">كل سنة وانتي طيبة يا أجمل حاجة حصلتلي ❤️</div>
</div>

<audio id="song" src="https://files.catbox.moe/21wtjl.mp3"></audio>

<script>
/* الباسورد */
function checkPass(){
  if(document.getElementById("pass").value==="24/3"){
    document.getElementById("lockScreen").style.display="none";
    document.getElementById("content").style.display="block";
    calculateDays();
    countdownBirthday();
    typeWriter();
  }else{
    document.getElementById("wrong").style.display="block";
  }
}

/* القلوب */
const container=document.querySelector(".hearts");
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(5+Math.random()*5)+"s";
 h.style.opacity=Math.random();
 container.appendChild(h);
}

/* كتابة تدريجية */
const message=`يمكن مش بعرف اقول كلام كبير...
بس وجودك في يومي بقى جزء منه
من 2 يوليو 2025 و انتي بقيتي عادة حلوة في حياتي
و كل يوم معاكي بيعدي احلى من اللي قبله ❤️`;

let i=0;
function typeWriter(){
 if(i<message.length){
  document.getElementById("text").innerHTML+=message.charAt(i);
  i++;
  setTimeout(typeWriter,40);
 }
}

/* حساب الأيام */
function calculateDays(){
 let start=new Date("2025-07-02");
 let now=new Date();
 let diff=Math.floor((now-start)/(1000*60*60*24));
 document.getElementById("days").innerText="عدى علينا "+diff+" يوم سوا 💞";
}

/* countdown عيد ميلاد */
function countdownBirthday(){
 const target=new Date("2026-03-24T00:00:00");
 setInterval(()=>{
   let now=new Date();
   let diff=target-now;
   if(diff<0)return;
   let d=Math.floor(diff/1000/60/60/24);
   document.getElementById("countdown").innerText="فاضل "+d+" يوم على عيد ميلادك 🎂";
 },1000);
}

/* تشغيل الأغنية + النهاية */
function startAll(){
 let audio=document.getElementById("song");
 audio.volume=0.6;
 audio.play();
 setTimeout(()=>document.getElementById("final").style.display="block",7000);
}
</script>

</body>
</html>
