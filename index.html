<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بصراحة 💗</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd1dc,#ffe6f0);
font-family:system-ui;
}

.card{
background:white;
padding:35px;
border-radius:25px;
text-align:center;
width:85%;
max-width:350px;
box-shadow:0 10px 40px rgba(0,0,0,.15);
}

input{
width:80%;
padding:14px;
border-radius:15px;
border:2px solid #eee;
font-size:18px;
text-align:center;
margin-top:15px;
}

button{
margin-top:18px;
padding:14px 30px;
border:none;
border-radius:20px;
font-size:18px;
background:#ff4d79;
color:white;
cursor:pointer;
}

button:active{transform:scale(.95)}
</style>
</head>

<body>

<div class="card" id="content">

<h2>بصراحة 💗</h2>

<p id="text">
هنا الرسالة...
</p>

<h3 id="daysTogether"></h3>
<h3 id="countdown"></h3>

<button id="play">شغلي الأغنية 🎵</button>

</div>

<script>
// تاريخ بداية علاقتكم
const loveDate = new Date("2025-07-02T00:00:00");

// عيد ميلادها
const birthday = new Date("2026-03-24T00:00:00");

function updateCounters(){

  const now = new Date();

  // ====== عدد الأيام سوا ======
  const diffLove = now - loveDate;
  const daysTogether = Math.floor(diffLove / (1000*60*60*24));

  document.getElementById("daysTogether").innerText =
  "عدى علينا " + daysTogether + " يوم سوا 💞";


  // ====== العد التنازلي لعيد ميلادها ======
  const diffBirth = birthday - now;

  if(diffBirth > 0){
    const d = Math.floor(diffBirth / (1000*60*60*24));
    const h = Math.floor((diffBirth/(1000*60*60)) % 24);
    const m = Math.floor((diffBirth/(1000*60)) % 60);

    document.getElementById("countdown").innerText =
    "فاضل " + d + " يوم " + h + " ساعة " + m + " دقيقة 🎂";
  }
  else{
    document.getElementById("countdown").innerText =
    "النهارده عيد ميلادك 🎉";
  }
}

updateCounters();
setInterval(updateCounters,60000);
</script>
</body>
</html>
