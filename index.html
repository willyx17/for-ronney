<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بصراحة 💗</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background: linear-gradient(to bottom,#f8cdda,#fbc2eb);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:white;
padding:30px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
position:relative;
z-index:2;
}

input{
width:80%;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
margin:15px 0;
text-align:center;
font-size:16px;
}

button{
background:#ff4f7b;
border:none;
padding:12px 25px;
border-radius:25px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

#content{
display:none;
margin-top:15px;
font-size:15px;
line-height:1.8;
}

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:float 6s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}
</style>
</head>

<body>

<div class="card">

<h2>بصراحة 💗</h2>

<div id="login">
<input type="password" id="pass" placeholder="اكتبي التاريخ">
<br>
<button onclick="checkPass()">دخول</button>
</div>

<div id="content">
<p id="text"></p>
<h3 id="daysTogether"></h3>
<h3 id="countdown"></h3>
</div>

</div>

<script>

// الباسورد
function checkPass(){
let p=document.getElementById("pass").value;
if(p==="24/3"){
document.getElementById("login").style.display="none";
document.getElementById("content").style.display="block";
startAll();
}else{
alert("غلط 😅");
}
}

// الرسالة
const message=`يمكن مش بعرف أقول كلام كبير...
بس وجودك في يومي بقى جزء مني.
من يوم 2 يوليو 2025
وانتي بقيتي عادة حلوة في حياتي ❤️

مش شرط نتكلم طول الوقت
ولا نعمل حاجات كبيرة
كفاية إحساس إنك معايا
ده لوحده بيخليني مبسوط.

يمكن مش بقولها دايماً...
بس أنا مرتاح معاكي بجد 💗`;

let i=0;

function typeWriter(){
if(i<message.length){
document.getElementById("text").innerHTML+=message.charAt(i);
i++;
setTimeout(typeWriter,35);
}
}

// العدادات
const loveDate=new Date("2025-07-02T00:00:00");
const birthday=new Date("2026-03-24T00:00:00");

function updateCounters(){
let now=new Date();

let diffLove=now-loveDate;
let days=Math.floor(diffLove/(1000*60*60*24));
document.getElementById("daysTogether").innerText=
"عدى علينا "+days+" يوم سوا 💞";

let diffBirth=birthday-now;
if(diffBirth>0){
let d=Math.floor(diffBirth/(1000*60*60*24));
let h=Math.floor((diffBirth/(1000*60*60))%24);
let m=Math.floor((diffBirth/(1000*60))%60);

document.getElementById("countdown").innerText=
"فاضل "+d+" يوم "+h+" ساعة "+m+" دقيقة 🎂";
}
}

function startAll(){
typeWriter();
updateCounters();
setInterval(updateCounters,60000);
}

// القلوب
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},800);

</script>

</body>
</html>
