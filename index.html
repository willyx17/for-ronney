<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليكي ❤️</title>

<style>

body{
  margin:0;
  font-family: system-ui;
  background:linear-gradient(135deg,#ffd1dc,#ffe6eb);
  text-align:center;
  overflow:hidden;
}

/* الكارت */
.card{
  background:white;
  padding:30px;
  border-radius:25px;
  width:90%;
  max-width:420px;
  margin:70px auto;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  position:relative;
  z-index:2;
}

/* الزرار */
.main{
  background:#ff4d6d;
  border:none;
  padding:15px 30px;
  border-radius:30px;
  color:white;
  font-size:18px;
  cursor:pointer;
  margin-top:20px;
  transition:.3s;
}
.main:hover{ transform:scale(1.08); }

/* القلوب */
.hearts{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  overflow:hidden;
  z-index:0;
}
.heart{
  position:absolute;
  width:18px;height:18px;
  background:red;
  transform:rotate(45deg);
  animation:float 8s linear infinite;
}
.heart:before,.heart:after{
  content:'';
  position:absolute;
  width:18px;height:18px;
  background:red;
  border-radius:50%;
}
.heart:before{top:-9px;left:0}
.heart:after{left:-9px;top:0}

@keyframes float{
  from{transform:translateY(100vh) rotate(45deg)}
  to{transform:translateY(-10vh) rotate(45deg)}
}

/* الكتابة */
#text{
  line-height:2;
  min-height:220px;
  white-space:pre-line;
}

.hidden{display:none}

</style>
</head>

<body>

<div class="hearts"></div>

<!-- باسورد -->
<div class="card" id="login">
<h2>ادخلي التاريخ 🎀</h2>
<input id="pass" type="password" placeholder="اليوم/الشهر">
<br>
<button class="main" onclick="checkPass()">دخول</button>
<p id="error" style="color:red"></p>
</div>

<!-- المحتوى -->
<div class="card hidden" id="content">
<h2>بصراحة 💗</h2>

<p id="text"></p>

<h3 id="days"></h3>
<h3 id="countdown"></h3>

<button class="main" onclick="startAll()">ابدئي 🎶</button>
</div>

<audio id="song" src="https://files.catbox.moe/21wtjl.mp3"></audio>

<script>

/* القلوب */
const heartsContainer=document.querySelector(".hearts");
for(let i=0;i<40;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=5+Math.random()*5+"s";
  h.style.opacity=Math.random();
  heartsContainer.appendChild(h);
}

/* باسورد */
function checkPass(){
  if(document.getElementById("pass").value==="24/3"){
    login.classList.add("hidden");
    content.classList.remove("hidden");
    calcDays();
    calcCountdown();
  }else{
    error.innerText="غلط 🙈";
  }
}

/* حساب الأيام */
function calcDays(){
  let start=new Date("2025-07-02");
  let now=new Date();
  let diff=Math.floor((now-start)/(1000*60*60*24));
  document.getElementById("days").innerText=
  "عدى علينا "+diff+" يوم سوا 💞";
}

/* عيد الميلاد */
function calcCountdown(){
  let bday=new Date("2026-03-24");
  let now=new Date();
  let diff=Math.floor((bday-now)/(1000*60*60*24));
  document.getElementById("countdown").innerText=
  "فاضل "+diff+" يوم على عيد ميلادك 🎂";
}

/* الرسالة */
const message=`
يمكن مش بعرف أقول كلام كبير…
بس وجودك في يومي بقى جزء مني مش حاجة عابرة.

من يوم 2 يوليو 2025
و أنا بقيت بشوف حاجات كتير بشكل أحلى…
ضحكتي بقت أهدى
و مزاجي بقى أروق
و حتى الأيام الوحشة بقيت أعديها بسهولة
عشان انتي موجودة فيها.

مش شرط نتكلم طول الوقت
ولا نعمل حاجات كبيرة
كفاية إحساس إنك معايا
إن في حد قريب مني بالطريقة اللي تريح قلبي.

يمكن مش بقولها دايماً…
بس أنا مرتاح معاكي بشكل مش طبيعي ❤️
و مبسوط إننا بنكتب حكايتنا سوا يوم بيوم.
`;

/* كتابة + اغنية + مفاجأة */
function startAll(){

document.getElementById("song").play();

let i=0;
let speed=45;
let textDiv=document.getElementById("text");

function type(){
  if(i<message.length){
    textDiv.innerHTML+=message.charAt(i);
    i++;
    setTimeout(type,speed);
  }else{
    setTimeout(()=>{
      alert("بحبك ❤️");
    },800);
  }
}
type();
}

</script>

</body>
</html>
