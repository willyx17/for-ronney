}
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗</title>

<style>
body{
margin:0;
font-family:system-ui;
background:linear-gradient(180deg,#ffd6e0,#fff);
text-align:center;
overflow:hidden;
}

.card{
background:white;
width:90%;
max-width:500px;
margin:120px auto;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
position:relative;
z-index:2;
}

input{
padding:12px;
border-radius:12px;
border:1px solid #ccc;
font-size:18px;
text-align:center;
}

button{
margin-top:20px;
padding:15px 30px;
border:none;
background:#ff4d79;
color:white;
font-size:18px;
border-radius:40px;
cursor:pointer;
}

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:float linear forwards;
opacity:.7;
}

@keyframes float{
from{transform:translateY(0)}
to{transform:translateY(-110vh)}
}
</style>
</head>

<body>

<div class="card">
<h2>بصراحة 💗</h2>

<p id="days"></p>
<p id="countdown"></p>

<input id="pass" type="password" placeholder="الباسورد">
<br>
<button onclick="enter()">دخول</button>
<br><br>
<button onclick="playSong()">🎵 شغلي الأغنية</button>
</div>

<audio id="song" src="https://files.catbox.moe/21wtjl.mp3"></audio>

<script>

/* عداد الايام /
let start=new Date("2025-07-02");
let now=new Date();
let diff=Math.floor((now-start)/(1000606024));
document.getElementById("days").innerHTML="عدي علينا "+diff+" يوم سوا 💞";

/* عداد عيد الميلاد /
let birthday=new Date("2026-03-24");
let d=birthday-now;
let days=Math.floor(d/(1000606024));
let hours=Math.floor(d/(10006060)%24);
let minutes=Math.floor(d/(100060)%60);
document.getElementById("countdown").innerHTML="فاضل "+days+" يوم "+hours+" ساعة "+minutes+" دقيقة 🎂";

/ باسورد /
function enter(){
if(document.getElementById("pass").value==="24/3"){
window.location="message.html";
}else alert("غلط 🙈");
}

/ اغنية /
function playSong(){
document.getElementById("song").play();
}

/ قلوب */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},500);

</script>

</body>
</html
