<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليكي انتي ❤️</title>
<style>
body{
font-family: system-ui;
background:linear-gradient(135deg,#ffd6e0,#fff);
text-align:center;
padding:40px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
max-width:500px;
margin:auto;
transition:.5s;
}

button{
padding:12px 25px;
border:none;
border-radius:12px;
background:#ff4d6d;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.hidden{display:none}
#days{color:#ff4d6d;font-weight:bold}
</style>
</head>
<body>
<div class="card" id="start">
<h2>دوسي هنا ❤️</h2>
<button onclick="openMsg()">افتحي</button>
</div>
<div class="card hidden" id="msg">
<h2>بصراحة 💗</h2>
<p>
من يوم 2 يوليو 2025  
وانتي بقيتي جزء من يومي  
مش حاجة عابرة
</p>
<h3 id="days"></h3>
<p>
يمكن مش بعرف اقول كلام كبير  
بس وجودك فارق معايا بجد ❤️
</p>
</div>
<script>
function openMsg(){
document.getElementById("start").classList.add("hidden");
document.getElementById("msg").classList.remove("hidden");

let start=new Date("2025-07-02");
let now=new Date();
let diff=Math.floor((now-start)/(1000*60*60*24));
document.getElementById("days").innerText="عدى "+diff+" يوم من يوم ما عرفتك 🥹";
}
</script>
</body>
</html>
