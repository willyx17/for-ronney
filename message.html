<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:system-ui;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

#text{
width:85%;
max-width:500px;
line-height:1.9;
font-size:20px;
white-space:pre-line;
}

.heart{
position:fixed;
bottom:-20px;
font-size:18px;
animation:float linear forwards;
opacity:.8;
}

@keyframes float{
to{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>
<body>
<div id="text"></div>
<audio id="song" autoplay>
<source src="https://files.catbox.moe/21wtjl.mp3" type="audio/mpeg">
</audio>
<script>

const message=`يمكن مش بعرف أقول كلام كبير...

بس وجودك في يومي بقى جزء مني
من 2 يوليو 2025 وانتي بقيتي عادة حلوة في حياتي ❤️

مش شرط نتكلم طول الوقت
ولا نعمل حاجات كبيرة

كفاية إحساس إنك معايا
ده لوحده بيخليني مبسوط

يمكن مش بقولها دايماً...
بس أنا مرتاح معاكي بجد 💗

و عايز نفضل نحكي حكايتنا سوا يوم بيوم...`;

let i=0;
function type(){
if(i<message.length){
document.getElementById("text").innerHTML+=message[i];
i++;
setTimeout(type,40);
}
}
type();

document.getElementById("song").volume=0.6;

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},400);

</script>
</body>
</html>
