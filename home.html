"}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليكي</title>

<style>
body{
background:linear-gradient(135deg,#ffd1dc,#ffe6ef);
font-family:system-ui;
text-align:center;
margin:0;
}

.card{
background:white;
margin:120px auto;
padding:30px;
border-radius:25px;
width:90%;
max-width:420px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
}

input{
padding:12px;
border-radius:14px;
border:1px solid #ddd;
text-align:center;
font-size:18px;
width:160px;
}

button{
margin-top:15px;
background:#ff4d6d;
color:white;
border:none;
padding:13px 28px;
border-radius:25px;
font-size:18px;
}

h3{margin-top:18px}
</style>
</head>

<body>

<div class="card">
<h2>بصراحة 💗</h2>

<h3 id="days"></h3>
<h3 id="countdown"></h3>

<br>
<input id="pass" placeholder="التاريخ">
<br>
<button onclick="go()">افتحي</button>

<p id="err" style="color:red"></p>
</div>

<script>

/* عدد الأيام /
const start=new Date("2025-07-02T00:00:00");
const now=new Date();
const diff=Math.floor((now-start)/86400000);
days.innerText="عدى علينا "+diff+" يوم سوا 💞";

/ عيد الميلاد /
const target=new Date("2026-03-24T00:00:00");
setInterval(()=>{
let n=new Date();
let d=Math.floor((target-n)/86400000);
let h=Math.floor((target-n)%86400000/3600000);
let m=Math.floor((target-n)%3600000/60000);
countdown.innerText="فاضل "+d+" يوم "+h+" ساعة "+m+" دقيقة 🎂";
},1000);

/ دخول */
function go(){
if(pass.value==="24/3"){
location.href="love.html";
}else err.innerText="التاريخ غلط 🙈";
}
</script>

</body>
</html>
